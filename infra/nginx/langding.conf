# ================================================================
# Nginx — langding.tc-gaming.live
# Location: /etc/nginx/sites-available/langding.conf
#
# Deploy:
#   sudo cp nginx.conf.langding /etc/nginx/sites-available/langding.conf
#   sudo ln -sf /etc/nginx/sites-available/langding.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d langding.tc-gaming.live
# ================================================================
# Rate limiting zone is defined in /etc/nginx/nginx.conf http {} block:
#   limit_req_zone $binary_remote_addr zone=langding:10m rate=20r/s;


# ── HTTP → HTTPS redirect ─────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name langding.tc-gaming.live;

    # Stealth: hide Nginx version
    server_tokens off;

    return 301 https://$host$request_uri;
}

# ── HTTPS ─────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name langding.tc-gaming.live;

    # ── SSL (Certbot sẽ điền tự động) ─────────────────────────
    ssl_certificate     /etc/letsencrypt/live/langding.tc-gaming.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/langding.tc-gaming.live/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/langding.tc-gaming.live/chain.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout       1d;
    ssl_session_cache         shared:SSL_langding:10m;
    ssl_session_tickets       off;
    # ssl_stapling off — cert qua Cloudflare không có OCSP URL, tránh warning
    ssl_stapling              off;
    ssl_stapling_verify       off;

    # Stealth: hide Nginx version in HTTPS responses
    server_tokens off;

    # ── Block malicious scanners (Shodan, Nikto, zgrab, Masscan…) ────────────
    # Return 444 — drops TCP connection with no response (nothing to fingerprint)
    if ($http_user_agent ~* "(nmap|nikto|wikto|openvas|sqlmap|metasploit|zgrab|masscan|dirbuster|nuclei)") {
        return 444;
    }

    # ── Security headers ───────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "SAMEORIGIN"                                   always;
    add_header X-Content-Type-Options     "nosniff"                                      always;
    add_header X-XSS-Protection           "1; mode=block"                                always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()"     always;

    # ── Gzip ──────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_min_length   256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/atom+xml image/svg+xml font/woff2;

    client_max_body_size 25M;

    # ── Next.js static — cache 1 năm, immutable ───────────────
    # Chunk filenames include content hash → safe to cache forever.
    # Add_header must come AFTER ssl_* directives; inherited from server block.
    location /_next/static/ {
        alias /var/lkvip/langding/.next/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # ── Next.js HMR WebSocket (dev mode only) ─────────────────
    # Cloudflare chặn WebSocket nếu dùng Free plan — dùng "Development Mode"
    # hoặc truy cập trực tiếp IP server khi dev.
    location /_next/hmr {
        proxy_pass            http://127.0.0.1:3000;
        proxy_http_version    1.1;
        proxy_set_header      Upgrade    $http_upgrade;
        proxy_set_header      Connection "upgrade";
        proxy_set_header      Host       $host;
        proxy_read_timeout    86400s;   # keep-alive dài cho HMR
        proxy_send_timeout    86400s;
        proxy_cache_bypass    $http_upgrade;
        access_log off;
    }

    # ── Favicon / robots / sitemap ────────────────────────────
    location ~* ^/(favicon\.ico|robots\.txt|sitemap\.xml)$ {
        proxy_pass       http://127.0.0.1:3000;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Block dotfiles (.git, .env …) ─────────────────────────
    location ~ /\. {
        deny all;
        access_log    off;
        log_not_found off;
    }

    # ── Next.js app (tất cả routes + SSE) ────────────────────
    location / {
        # Rate limit: 20 req/s, burst 40, no delay on burst
        limit_req zone=langding burst=40 nodelay;

        proxy_pass            http://127.0.0.1:3000;
        proxy_http_version    1.1;
        proxy_set_header      Upgrade           $http_upgrade;
        proxy_set_header      Connection        "upgrade";
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_cache_bypass    $http_upgrade;
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        # SSE: tắt buffering để stream về ngay
        proxy_buffering       off;
        proxy_cache           off;

        # Stealth: strip upstream identity headers before sending to client
        proxy_hide_header     X-Powered-By;
        proxy_hide_header     Server;
        proxy_hide_header     X-AspNet-Version;
        proxy_hide_header     X-AspNetMvc-Version;
    }

    # ── Logs ──────────────────────────────────────────────────
    access_log /var/log/nginx/langding_access.log;
    error_log  /var/log/nginx/langding_error.log warn;
}
