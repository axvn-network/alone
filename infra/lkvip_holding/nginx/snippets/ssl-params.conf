# ================================================================
# /etc/nginx/snippets/ssl-params.conf
#
# Chuẩn Mozilla Modern SSL — dùng chung cho tất cả vhosts
# Copy vào: /etc/nginx/snippets/ssl-params.conf
#
# Lưu ý ssl_stapling: off — khi dùng Cloudflare cert proxy
#   (Cloudflare không có OCSP URL riêng cho certs qua proxy)
#   Đổi thành ssl_stapling on nếu cert direct từ Let's Encrypt
# ================================================================
ssl_protocols             TLSv1.2 TLSv1.3;
ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
ssl_prefer_server_ciphers off;
ssl_session_timeout       1d;
ssl_session_cache         shared:SSL_LKVIP:10m;
ssl_session_tickets       off;
ssl_stapling              off;
ssl_stapling_verify       off;
